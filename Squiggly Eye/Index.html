<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squiggly Eye</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <button id="modeToggle" class="mode-toggle">Mode: Manual</button>
        <button id="moodToggle" class="mood-toggle">Mood: Neutral</button>
        <button id="blinkToggle" class="toggle-btn">Blink: ON</button>
    </div>

    <div class="face">
        <div class="eyebrows">
            <div class="eyebrow left"></div>
            <div class="eyebrow right"></div>
        </div>

        <div class="eyes">

            <div class="eye Left">
                <div class="eyeball"></div>
            </div>

            <div class="eye Right">
                <div class="eyeball"></div>
            </div>

        </div>

        <div class="mouth neutral"></div>

    </div>
    <script src="script.js"></script>
</body>
</html>
